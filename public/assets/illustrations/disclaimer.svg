<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380">
    <!-- Background decorative shapes -->
    <circle cx="70" cy="60" r="34" fill="#eef4fb" />
    <circle cx="430" cy="320" r="46" fill="#eef4fb" />
    <rect x="40" y="290" width="70" height="70" rx="14" fill="#eef4fb" />

    <!-- Ground line -->
    <rect x="60" y="330" width="360" height="6" rx="3" fill="#dde5ee" />

    <!-- Standing document (surat / berkas) -->
    <g>
        <rect x="150" y="90" width="150" height="200" rx="10" fill="#ffffff" stroke="#dde5ee" stroke-width="3" />
        <rect x="150" y="90" width="150" height="34" rx="10" fill="#003d7a" />
        <rect x="172" y="146" width="106" height="8" rx="4" fill="#dde5ee" />
        <rect x="172" y="168" width="106" height="8" rx="4" fill="#dde5ee" />
        <rect x="172" y="190" width="80" height="8" rx="4" fill="#dde5ee" />
        <rect x="172" y="222" width="106" height="8" rx="4" fill="#eef4fb" />
        <rect x="172" y="244" width="106" height="8" rx="4" fill="#eef4fb" />
        <rect x="172" y="266" width="60" height="8" rx="4" fill="#eef4fb" />
    </g>

    <!-- Shield badge overlapping the document (legal / official notice) -->
    <g transform="translate(255,190)">
        <path d="M55 0
                 C 55 0, 95 14, 95 14
                 L 95 66
                 C 95 100, 70 118, 55 128
                 C 40 118, 15 100, 15 66
                 L 15 14
                 C 15 14, 55 0, 55 0 Z"
              fill="#0066cc" stroke="#002a57" stroke-width="4" />
        <path d="M35 62 L50 78 L78 46" fill="none" stroke="#ffffff" stroke-width="7"
              stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Magnifier checking accuracy of information -->
    <g transform="translate(300,60)">
        <circle cx="24" cy="24" r="24" fill="#ffffff" stroke="#003d7a" stroke-width="6" />
        <line x1="41" y1="41" x2="62" y2="62" stroke="#003d7a" stroke-width="8" stroke-linecap="round" />
        <path d="M14 24 h20 M24 14 v20" stroke="#0066cc" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Small info dot accents -->
    <circle cx="120" cy="200" r="6" fill="#0066cc" />
    <circle cx="120" cy="230" r="6" fill="#8ec6ff" />
    <circle cx="120" cy="260" r="6" fill="#dde5ee" />
</svg>